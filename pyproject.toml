[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "banglamedscribe"
version = "0.2.0a1"
description = "Bangla/Banglish clinical speech processing, ASR evaluation, and documentation research prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Md. Sifat" },
]
keywords = [
  "bangla",
  "bengali",
  "automatic-speech-recognition",
  "speaker-diarization",
  "clinical-speech",
  "whisper",
  "speech-processing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1.0"]
diarization = ["pyannote.audio>=4.0,<5"]
dev = ["build>=1.2", "httpx>=0.27", "pytest>=8.3", "ruff>=0.7"]

[project.urls]
Homepage = "https://github.com/sifat371/BanglaMedScribe"
Repository = "https://github.com/sifat371/BanglaMedScribe"
Issues = "https://github.com/sifat371/BanglaMedScribe/issues"

[project.scripts]
bms-transcribe = "banglamedscribe.cli:main"
bms-diarize = "banglamedscribe.diarization_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/banglamedscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
