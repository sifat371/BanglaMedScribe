[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "banglamedscribe"
version = "0.1.0"
description = "Bangla/Banglish clinical documentation assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1.0"]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.7"]

[project.scripts]
bms-transcribe = "banglamedscribe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/banglamedscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
